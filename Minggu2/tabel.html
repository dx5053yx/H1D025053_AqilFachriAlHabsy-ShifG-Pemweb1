<!DOCTYPE html>
<html>
<head>
    <title>Percobaan 3 - Tabel</title>
    <style>
        table, th, td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <p>Tabel biasa</p>
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Elon</td>
            <td>Musk</td>
            <td>51</td>
        </tr>
        <tr>
            <td>Bill</td>
            <td>Gates</td>
            <td>67</td>
        </tr>
    </table>

    <p>Colspan</p>
    <table>
        <tr>
            <th colspan="2">Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Elon</td>
            <td>Musk</td>
            <td>51</td>
        </tr>
        <tr>
            <td>Bill</td>
            <td>Gates</td>
            <td>67</td>
        </tr>
    </table>
    <p>Rowspan</p>
    <table>
        <tr>
            <th>Name</th>
            <td>age</td>
        </tr>
        <tr>
            <td rowspan="2">phone</td>
            <td>0238948</td>
        </tr>
        <tr>
            <td>384753</td>
        </tr>
    </table>
</body>
</html>
