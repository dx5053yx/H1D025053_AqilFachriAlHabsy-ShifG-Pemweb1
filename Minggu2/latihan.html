<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Latihan Form</title>
    </head>
    <body>
        <form>
            <table>
                <tr>
                    <td>Nama</td>
                    <td><input type="text" id="nama" name="nama" value="Romi"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="email" id="email" name="email" value="romi@gmail.com"></td>
                </tr>
                <tr>
                    <td>Username</td>
                    <td><input type="text" id="username" name="username" value="romi"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password" id="password" name="password" value="password"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td><select id="jenis-kelamin" name="jenis-kelamin">
                    <option value="laki-laki" selected>Laki-Laki</option>
                    <option value="perempuan">Perempuan</option>
                </select><br></td>
                </tr>
                <tr>
                    <td>Alamat</td>
                    <td><textarea name="alamat" rows="10" cols="30">Bogor</textarea><br></td>
                </tr>
                <tr>
                    <td><input type="submit" value="Simpan" id="submit" name="submit"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
