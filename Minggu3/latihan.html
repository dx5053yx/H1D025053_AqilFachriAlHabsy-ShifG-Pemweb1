<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS - Posisi Tengah</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        .layout {
            width: min(80vw, 960px);
            height: min(74vh, 740px);
            display: grid;
            grid-template-rows: 16% 1fr 6%;
            gap: 4px;
        }

        .layout div {
            border: 2px solid #222;
        }
    </style>
</head>
<body>
    <main class="layout" aria-label="Contoh layout dengan tiga kotak">
        <div></div>
        <div></div>
        <div></div>
    </main>
</body>
</html>
